
name: Android APK

on:
  workflow_dispatch:

  release:
    types: [published]

# Prevent multiple builds for the same branch or release.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android_build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # --------------------------------------------------
      # Setup Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # --------------------------------------------------
      # Disable Expo telemetry
      # --------------------------------------------------
      - name: Configure environment
        run: |
          echo "CI=1" >> "$GITHUB_ENV"
          echo "EXPO_NO_TELEMETRY=1" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # Create .env
      # --------------------------------------------------
      - name: Create .env
        env:
          EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL }}
          EXPO_PUBLIC_TRUECALLER_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_TRUECALLER_CLIENT_ID }}
        run: |
          {
            printf 'EXPO_PUBLIC_BACKEND_URL=%s\n' "$EXPO_PUBLIC_BACKEND_URL"
            printf 'EXPO_PUBLIC_TRUECALLER_CLIENT_ID=%s\n' "$EXPO_PUBLIC_TRUECALLER_CLIENT_ID"
          } > .env

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # Generate Android native project
      # --------------------------------------------------
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      # --------------------------------------------------
      # Validate Gradle wrapper
      # --------------------------------------------------
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # --------------------------------------------------
      # Gradle setup and caching
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # --------------------------------------------------
      # Configure Gradle
      # --------------------------------------------------
      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle

          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          EOF

      # --------------------------------------------------
      # Check disk space
      # --------------------------------------------------
      - name: Check disk space before build
        run: |
          echo "=== Disk space ==="
          df -h

          echo "=== Memory ==="
          free -h

      # --------------------------------------------------
      # Build Release APK
      # --------------------------------------------------
      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease \
            --build-cache \
            --parallel \
            --stacktrace
      # --------------------------------------------------
      # Check disk space after build
      # --------------------------------------------------
      - name: Check disk space after build
        if: always()
        run: df -h

      # --------------------------------------------------
      # Prepare APK
      # --------------------------------------------------
      - name: Prepare APK
        run: |
          mkdir -p apks

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Release APK was not generated."
            echo "Available APK files:"
            find android/app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi

          cp "$APK_PATH" apks/app-release.apk

          echo "=== APK information ==="
          ls -lh apks/app-release.apk
          sha256sum apks/app-release.apk

      # --------------------------------------------------
      # Upload APK as GitHub Actions artifact
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: apks/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # --------------------------------------------------
      # Upload APK to GitHub Release
      # --------------------------------------------------
      - name: Upload APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: apks/app-release.apk
          fail_on_unmatched_files: true

      # ==================================================
      # DEBUG BUILD — DISABLED
      # ==================================================

